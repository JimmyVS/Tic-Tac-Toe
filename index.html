<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Tic-Tac-Toe Select</title>
    <link rel="stylesheet" href="css/index.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <main class="selection-Main">
        <h1 id="game-Title">Tic-Tac-Toe</h1>
        <h2 id="difficulty-Title">Select difficulty</h2>
        <section class="mode-Selection">
            <div class="mode" id="Easy">
                <h2 class="difficulty">Easy</h2>
            </div>
            <div class="mode" id="Hard">
                <h2 class="difficulty">Hard</h2>
            </div>
            <div class="mode" id="Players">
                <h2 class="difficulty">Players</h2>
            </div>
        </section>

        <h2 id="difficulty-Title">Player 1 select</h2>
        <section class="player-Selection">
            <div class="player-Box" id="x-player">
                <h2 class="player">X</h2>
            </div>
            <div class="player-Box" id="o-player">
                <h2 class="player">O</h2>
            </div>
        </section>

        <div class="start">
            <button id="start-Button">Start</button>
        </div>
    </main>

    <script src="Javascript/selection.js"></script>
</body>
</html>
